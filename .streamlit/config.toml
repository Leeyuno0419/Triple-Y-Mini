# 웹 데모 색상 테마. OS가 다크 모드여도 흰 카드 위 글자가 보이도록 라이트 테마로 고정한다.
[theme]
base = "light"
primaryColor = "#111418"
backgroundColor = "#FDFCF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111418"

# app/static/ 안의 이미지를 /app/static/파일명 주소로 보여 준다 (하단 바 로고에 사용)
[server]
enableStaticServing = true

# 브라우저와 연결이 끊긴 세션(절전·네트워크 끊김·탭이 오래 비활성)을 이만큼(초) 보관한다. 기본값 120초(2분)가 지나면 서버가 세션 상태와
# 업로드한 파일을 지워서, 돌아왔을 때 처음 화면이 되어 버린다. 6시간으로 늘려 자리를 비웠다 와도 이어서 쓸 수 있게 한다.
disconnectedSessionTTL = 21600
